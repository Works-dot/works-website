kind = "web"
previewPath = "/"
title = "Works. Website"
version = "1.0.0"
id = "artifacts/works-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20022

[services.development]
run = "pnpm --filter @workspace/works-website run dev"

[services.production]
build = [ "sh", "-c", "node artifacts/works-website/scripts/fetch-strapi-data.mjs && VITE_STRAPI_ENABLED=false pnpm --filter @workspace/works-website run build" ]
[services.production.run]
args = ["node", "artifacts/works-website/server.mjs"]

[services.production.run.env]
PORT = "20022"

[services.env]
PORT = "20022"
BASE_PATH = "/"
